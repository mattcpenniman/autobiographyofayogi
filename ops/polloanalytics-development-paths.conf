# VEC-1029: scoped to this site's two served document roots, not other tenants.
# Install as /etc/apache2/conf-available/polloanalytics-development-paths.conf.
<DirectoryMatch "^/mnt/www/map/polloanalytics\.com/(?:public_html|fileshare)/(?:.*/)?\.(?!well-known(?:/|$))">
    Require all denied
</DirectoryMatch>

<Directory "/mnt/www/map/polloanalytics.com/public_html">
    <FilesMatch "^\.|(?i:^(?:AGENTS|CLAUDE|QWEN)\.md$|^opencode\.jsonc?$)">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/mnt/www/map/polloanalytics.com/fileshare">
    <FilesMatch "^\.|(?i:^(?:AGENTS|CLAUDE|QWEN)\.md$|^opencode\.jsonc?$)">
        Require all denied
    </FilesMatch>
</Directory>
