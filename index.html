// Build sidebar TOC
function buildSidebar() {
  let html = '<div class="sidebar-section-label">Front Matter</div>';
  DATA.sections.forEach((s, i) => {
    const id = 'section-' + i;
    html += `<a href="#${id}" data-target="${id}">${s.title}</a>`;
  });
  html += '<div class="sidebar-section-label">Chapters</div>';
  DATA.chapters.forEach(ch => {
    const id = 'chapter-' + ch.number;
    html += `<a href="#${id}" data-target="${id}" class="chapter-link">${ch.number}. ${ch.title}</a>`;
  });
  sidebarNav.innerHTML = html;
}

// Render content
function renderContent() {
  let html = '';

  // Title page
  html += `<div class="title-page" id="title-page">
    <h1>${DATA.title}</h1>
    <div class="author">by ${DATA.author}</div>
    <div class="dedication">Dedicated to the Memory of Luther Burbank<br>An American Saint</div>
  </div>`;

  // Front matter sections
  DATA.sections.forEach((s, i) => {
    const id = 'section-' + i;
    html += `<div class="chapter-heading" id="${id}">
      <div class="ch-number">Front Matter</div>
      <h2>${s.title}</h2>
      <div class="divider"></div>
    </div>`;
    html += `<div class="content">${formatContent(s.content)}</div>`;
  });

  // Chapters
  DATA.chapters.forEach((ch, idx) => {
    const id = 'chapter-' + ch.number;
    html += `<div class="chapter-heading" id="${id}">
      <div class="ch-number">Chapter ${ch.number}</div>
      <h2>${ch.title}</h2>
      <div class="divider"></div>
    </div>`;
    html += `<div class="content" id="chapter-content-${ch.number}">${formatContent(ch.content)}</div>`;

    // Chapter navigation
    if (idx > 0) {
      const prev = DATA.chapters[idx - 1];
      html += `<div class="chapter-nav">
        <a href="#chapter-${prev.number}">
          <span class="nav-label">&larr; Previous</span>
          <span class="nav-title">${prev.number}. ${prev.title}</span>
        </a>`;
    }
    if (idx < DATA.chapters.length - 1) {
      const next = DATA.chapters[idx + 1];
      html += `<a href="#chapter-${next.number}" class="nav-next">
          <span class="nav-label">Next &rarr;</span>
          <span class="nav-title">${next.number}. ${next.title}</span>
        </a>`;
    }
    html += '</div>';
  });

  contentWrapper.innerHTML = html;
}

// Format content text
function formatContent(text) {
  // Clean up text
  text = text.replace(/\u2014/g, '—').replace(/\u2013/g, '-').replace(/\u2012/g, '-');

  // Split into paragraphs
  const paragraphs = text.split(/\n\s*\n/);
  let html = '';
  let inFootnotes = false;

  for (const p of paragraphs) {
    const trimmed = p.trim();
    if (!trimmed) continue;

    // Detect footnotes section
    if (/^footnotes?$/i.test(trimmed)) {
      inFootnotes = true;
      continue;
    }

    // Detect footnote items
    if (inFootnotes && /^\d+[\.\)]\s/.test(trimmed)) {
      html += `<p class="no-indent footnote-item">${trimmed}</p>`;
      continue;
    }

    // Close footnotes section on blank line after
    if (inFootnotes && trimmed === '') {
      inFootnotes = false;
      continue;
    }

    // Detect section breaks
    if (/^[\*\*\*]+$/m.test(trimmed)) {
      html += '<div class="section-break">* * *</div>';
      continue;
    }

    // Detect centered text
    if (/^(ILLUSTRATION|Map of India|Frontispiece)/i.test(trimmed)) {
      html += `<p class="center">${trimmed}</p>`;
      continue;
    }

    // Build paragraph
    const lines = trimmed.split(/\n/).filter(l => l.trim());
    let paraHtml = lines.map(l => {
      let line = l.trim();
      // Handle italics (wrapped in _)
      line = line.replace(/_(.+?)_/g, '<em>$1</em>');
      // Handle ALLCAPS (was italics in original)
      if (line === line.toUpperCase() && line.length > 3) {
        // Keep as is - these are emphasis in the source
      }
      return line;
    }).join('<br>');

    html += `<p>${paraHtml}</p>`;
  }

  return html;
}

// Build search index
function buildSearchIndex() {
  searchIndex = [];
  DATA.chapters.forEach(ch => {
    const text = ch.content.replace(/<[^>]*>/g, '').trim();
    searchIndex.push({
      chapter: ch.number,
      title: ch.title,
      text: text,
      id: 'chapter-' + ch.number
    });
  });
}

// Search
function doSearch(query) {
  if (!query || query.length < 2) {
    searchResults.classList.remove('show');
    return;
  }

  const lower = query.toLowerCase();
  const results = [];

  for (const item of searchIndex) {
    const idx = item.text.toLowerCase().indexOf(lower);
    if (idx !== -1) {
      // Get context around the match
      const start = Math.max(0, idx - 60);
      const end = Math.min(item.text.length, idx + query.length + 80);
      let excerpt = item.text.substring(start, end);
      const highlight = item.text.substring(idx, idx + query.length);
      excerpt = excerpt.replace(new RegExp(`(${escapeRegex(query)})`, 'gi'), '<mark>$1</mark>');
      if (start > 0) excerpt = '...' + excerpt;
      if (end < item.text.length) excerpt = excerpt + '...';

      results.push({
        chapter: item.chapter,
        title: item.title,
        excerpt: excerpt,
        id: item.id
      });
    }
  }

  searchCount.textContent = results.length + ' result' + (results.length !== 1 ? 's' : '');
  searchResultsList.innerHTML = results.slice(0, 20).map(r =>
    `<div class="search-result-item" data-target="${r.id}">
      <div class="result-chapter">Chapter ${r.chapter}: ${r.title}</div>
      <div class="result-excerpt">${r.excerpt}</div>
    </div>`
  ).join('');

  if (results.length > 20) {
    searchResultsList.innerHTML += `<div class="search-result-item" style="text-align:center;color:#999;cursor:default;">
      ${results.length - 20} more results...
    </div>`;
  }

  searchResults.classList.add('show');

  // Bind click handlers
  searchResultsList.querySelectorAll('.search-result-item[data-target]').forEach(el => {
    el.addEventListener('click', () => {
      navigateTo(el.dataset.target);
      searchResults.classList.remove('show');
      searchInput.value = '';
    });
  });
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// Navigation
function navigateTo(id) {
  const el = document.getElementById(id);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  // Close sidebar on mobile
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

// Update active chapter in sidebar
function updateActiveChapter() {
  const scrollY = window.scrollY + 100;
  const allLinks = sidebarNav.querySelectorAll('a');
  let activeId = null;

  for (const link of allLinks) {
    const target = document.getElementById(link.dataset.target);
    if (target && target.offsetTop <= scrollY) {
      activeId = link.dataset.target;
    }
  }

  allLinks.forEach(l => l.classList.remove('active'));
  if (activeId) {
    const activeLink = sidebarNav.querySelector(`a[data-target="${activeId}"]`);
    if (activeLink) {
      activeLink.classList.add('active');
      // Update topbar title
      if (activeLink.classList.contains('chapter-link')) {
        const chNum = activeId.replace('chapter-', '');
        const ch = DATA.chapters.find(c => c.number == chNum);
        if (ch) topbarTitle.textContent = `Ch. ${ch.number}: ${ch.title}`;
      } else {
        topbarTitle.textContent = DATA.title;
      }
    }
  }

  // Update progress bar
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollY / docHeight) * 100 : 0;
  progressFill.style.width = progress + '%';

  // Update bookmark button
  const currentCh = DATA.chapters.find(c => 'chapter-' + c.number === activeId);
  if (currentCh) {
    const bookmarked = JSON.parse(localStorage.getItem('autobiographyyogi_bookmarks') || '[]');
    const isBookmarked = bookmarked.includes(currentCh.number);
    bookmarkBtn.innerHTML = isBookmarked ? '&#9733;' : '&#9651;';
    bookmarkBtn.classList.toggle('bookmarked', isBookmarked);
  }
}

// Event listeners
hamburger.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});

overlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
});

sidebarNav.addEventListener('click', (e) => {
  const link = e.target.closest('a');
  if (link && link.dataset.target) {
    e.preventDefault();
    navigateTo(link.dataset.target);
  }
});

searchInput.addEventListener('input', (e) => doSearch(e.target.value));
searchClose.addEventListener('click', () => {
  searchResults.classList.remove('show');
  searchInput.value = '';
});

bookmarkBtn.addEventListener('click', () => {
  if (!currentChapter) return;
  let bookmarked = JSON.parse(localStorage.getItem('autobiographyyogi_bookmarks') || '[]');
  if (bookmarked.includes(currentChapter)) {
    bookmarked = bookmarked.filter(n => n !== currentChapter);
  } else {
    bookmarked.push(currentChapter);
  }
  localStorage.setItem('autobiographyyogi_bookmarks', JSON.stringify(bookmarked));
  bookmarkBtn.innerHTML = bookmarked.includes(currentChapter) ? '&#9733;' : '&#9651;';
  bookmarkBtn.classList.toggle('bookmarked', bookmarked.includes(currentChapter));
});

fontExpand.addEventListener('click', () => {
  fontSize = Math.min(28, fontSize + 2);
  document.body.style.fontSize = fontSize + 'px';
  fontSizeLabel.textContent = fontSize + 'px';
});

fontShrink.addEventListener('click', () => {
  fontSize = Math.max(12, fontSize - 2);
  document.body.style.fontSize = fontSize + 'px';
  fontSizeLabel.textContent = fontSize + 'px';
});

// Scroll handler (throttled)
let scrollTicking = false;
window.addEventListener('scroll', () => {
  if (!scrollTicking) {
    requestAnimationFrame(() => {
      updateActiveChapter();
      scrollTicking = false;
    });
    scrollTicking = true;
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    searchResults.classList.remove('show');
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  }
});

// Initialize
buildSidebar();
renderContent();
buildSearchIndex();
updateActiveChapter();
</script>
</body>
</html>
